<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Admin Girişi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', sans-serif;}
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="mb-4 fw-bold text-dark">🛡️ Yönetici Girişi</h3>
        
        {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/api/admin/login">
            <div class="mb-3 text-start">
                <label class="form-label fw-bold text-muted small">Sistem Şifresi</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="Şifrenizi girin..." required>
            </div>
            <button type="submit" class="btn btn-dark btn-lg w-100 mt-2">Giriş Yap</button>
        </form>
    </div>
</body>
</html>
